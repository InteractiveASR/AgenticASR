[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-asr"
version = "0.1.0"
description = "Interactive ASR research artifact with Agentic ASR, S2ER, and simulation tooling."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["interactive_asr*"]
